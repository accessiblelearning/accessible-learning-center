<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student ID - Accessible Learning Center</title>
  <link rel="stylesheet" href="styles.css">
  <script src="accessibility.js" defer></script>
</head>

<body>

  <header>
    <h1>Student ID</h1>
    <p>Enter a username or Student ID to begin or continue your learning progress.</p>
    <p>Do not use your full name or other private information.</p>
  </header>

  <main>

    <form id="studentForm">

      <label for="studentId">Student ID or Username</label>
      <input
        id="studentId"
        name="studentId"
        type="text"
        minlength="3"
        maxlength="64"
        pattern="[A-Za-z0-9_-]{3,64}"
        title="Use 3 to 64 letters, numbers, hyphens, or underscores."
        required
        autocomplete="username"
        aria-describedby="studentHelp"
      >

      <p id="studentHelp">
        Choose something you will remember, such as learner123 or braillestudent7.
      </p>

      <button type="submit">Continue</button>

    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <p><a href="index.html">Return to Home</a></p>

  </main>

  <script>
    const API_URL =
      "https://accessible-learning-api.aaccessabilitylearningcenter.workers.dev";

    const form = document.getElementById("studentForm");
    const studentIdInput = document.getElementById("studentId");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const studentId = studentIdInput.value.trim();

      if (!/^[A-Za-z0-9_-]{3,64}$/.test(studentId)) {
        message.textContent =
          "Use 3 to 64 letters, numbers, hyphens, or underscores for your Student ID.";
        return;
      }

      message.textContent = "Saving your Student ID...";

      try {
        const response = await fetch(API_URL + "/student", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            student_id: studentId
          })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          message.textContent =
            data.error || "Your Student ID could not be saved.";
          return;
        }

        localStorage.setItem("accessibleLearningStudentId", studentId);

        message.textContent =
          "Student ID saved. Opening your progress page.";

        window.location.href = "student-progress.html";

      } catch (error) {
        message.textContent =
          "There was a connection problem. Please try again.";
      }
    });
  </script>

</body>
</html>
