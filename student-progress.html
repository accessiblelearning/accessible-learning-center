<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Review saved Word, Excel, PowerPoint, JAWS, and Windows 11 lesson progress.">
  <title>Student Progress - Accessible Learning Center</title>
  <link rel="stylesheet" href="styles.css">
  <script src="accessibility.js" defer></script>
</head>
<body>
  <header>
    <h1>Student Progress</h1>
    <p id="studentName"></p>
  </header>

  <main id="main-content">
    <div id="progressMessage" role="status" aria-live="polite">Loading your progress...</div>
    <div id="courseProgressSections" class="course-progress-sections"></div>

    <nav aria-label="Progress actions">
      <ul class="card-list">
        <li><a href="lessons.html">Go to all lessons</a></li>
        <li><a href="student-id.html">Change Student ID</a></li>
        <li><a href="index.html">Return home</a></li>
      </ul>
    </nav>
  </main>

  <script>
    const API_URL =
      "https://accessible-learning-api.aaccessabilitylearningcenter.workers.dev";
    const studentId = localStorage.getItem("accessibleLearningStudentId");
    const studentName = document.getElementById("studentName");
    const progressMessage = document.getElementById("progressMessage");
    const courseProgressSections = document.getElementById("courseProgressSections");

    const courses = [
      {
            "name": "Microsoft Word",
            "slug": "word",
            "titles": [
                  "Opening Word, Creating, and Saving a Document",
                  "Moving, Selecting, and Editing Text",
                  "Find, Replace, Save, Close, and Reopen",
                  "Formatting Text and Paragraphs",
                  "Headings, Styles, and Document Navigation",
                  "Bulleted and Numbered Lists",
                  "Creating Accessible Tables",
                  "Links, Alt Text, and Accessibility",
                  "Spelling, Comments, and Track Changes",
                  "Final Independent Word Assignment"
            ]
      },
      {
            "name": "Microsoft Excel",
            "slug": "excel",
            "titles": [
                  "Excel Basics: Workbooks, Worksheets, and Cells",
                  "Navigating, Editing, Finding, and Filling Data",
                  "Formulas, AutoSum, and Basic Calculations",
                  "Accessible Formatting and Number Formats",
                  "Tables, Sorting, and Filtering",
                  "IF, COUNTIF, and Conditional Results",
                  "Managing Worksheets and Cross-Sheet References",
                  "Charts, Alternative Text, and Accessibility Checker",
                  "Data Validation, Consistent Entry, and Review",
                  "Final Employment Workbook Project"
            ]
      },
      {
      "name": "Microsoft PowerPoint",
      "slug": "powerpoint",
      "titles": [
            "PowerPoint Basics: Slides, Placeholders, and Saving",
            "Slide Layouts, Titles, and Organizing a Presentation",
            "Text, Bullets, and Clear Slide Content",
            "Images, Alternative Text, and Decorative Objects",
            "Reading Order and Keyboard Navigation",
            "Accessible Tables and Charts",
            "Meaningful Links and Contact Information",
            "Color, Contrast, Fonts, and Accessible Design",
            "Speaker Notes and Presenting with the Keyboard",
            "Final Accessible Workplace Presentation"
      ]
},
{
      "name": "JAWS Screen Reader",
      "slug": "jaws",
      "titles": [
            "Starting JAWS, Speech Control, and Keyboard Help",
            "Reading Text by Character, Word, Line, and Paragraph",
            "Windows Desktop, Start Menu, Taskbar, and App Switching",
            "Dialogs, Controls, the PC Cursor, and Keyboard Focus",
            "Web Navigation with the Virtual Cursor",
            "Forms Mode and Completing Web Forms",
            "Tables, Lists, and Structured Information",
            "Built-in Help, Settings, and Troubleshooting",
            "JAWS AI: FSCompanion and Picture Smart AI",
            "Final Workplace Navigation and Problem-Solving Project"
      ]
},
{
      "name": "Windows 11",
      "slug": "windows",
      "titles": [
            "Desktop, Start Menu, Search, and Taskbar",
            "Managing Windows, Switching Apps, Snap, and Virtual Desktops",
            "File Explorer Basics and Location Awareness",
            "Creating, Renaming, Copying, Moving, and Deleting Files",
            "Selecting, Sorting, Viewing, and Finding Files",
            "Settings and Built-in Accessibility Features",
            "Quick Settings, Notifications, Audio, and Connectivity",
            "Security, Privacy, Updates, and Safe Downloads",
            "Safe Troubleshooting, Task Manager, and Getting Help",
            "Final Workplace File and Window Management Project"
      ]
}
];

    if (!studentId) {
      window.location.href = "student-id.html";
    } else {
      studentName.textContent = "Student ID: " + studentId;
      loadProgress();
    }

    function createCourseSection(course, records) {
      const section = document.createElement("section");
      section.className = "course-progress";
      section.setAttribute("aria-labelledby", course.slug + "-progress-heading");

      const heading = document.createElement("h2");
      heading.id = course.slug + "-progress-heading";
      heading.textContent = course.name;

      const summary = document.createElement("p");
      const meter = document.createElement("progress");
      const list = document.createElement("ol");
      list.className = "progress-list";

      let submittedCount = 0;

      for (let i = 1; i <= course.titles.length; i++) {
        const record = records.find(
          item =>
            item.course === course.name &&
            Number(item.lesson_number) === i
        );
        const isSubmitted = Boolean(record && record.status === "submitted");
        if (isSubmitted) submittedCount += 1;

        const item = document.createElement("li");
        const link = document.createElement("a");
        const status = document.createElement("span");

        link.href = course.slug + "-lesson-" + i + ".html";
        link.textContent = "Lesson " + i + ": " + course.titles[i - 1];
        status.className = isSubmitted
          ? "lesson-status lesson-status--submitted"
          : "lesson-status";
        status.textContent = isSubmitted
          ? "Submitted. Attempts: " + record.attempts
          : "Not started";

        item.append(link, status);
        list.appendChild(item);
      }

      summary.textContent =
        submittedCount + " of " + course.titles.length + " lessons submitted.";
      meter.max = course.titles.length;
      meter.value = submittedCount;
      meter.textContent =
        submittedCount + " of " + course.titles.length + " lessons submitted";
      meter.setAttribute(
        "aria-label",
        course.name + ": " + submittedCount + " of " + course.titles.length + " lessons submitted"
      );

      section.append(heading, summary, meter, list);
      return { section, submittedCount };
    }

    async function loadProgress() {
      try {
        const response = await fetch(
          API_URL + "/progress?student_id=" + encodeURIComponent(studentId)
        );
        const data = await response.json();

        if (!response.ok || !Array.isArray(data)) {
          progressMessage.textContent = "Your progress could not be loaded.";
          return;
        }

        courseProgressSections.replaceChildren();
        let completedCourses = 0;

        for (const course of courses) {
          const result = createCourseSection(course, data);
          courseProgressSections.appendChild(result.section);
          if (result.submittedCount === course.titles.length) {
            completedCourses += 1;
          }
        }

        progressMessage.textContent =
          completedCourses === courses.length
            ? "All available courses are complete."
            : "Progress loaded for Word, Excel, PowerPoint, JAWS, and Windows 11.";
      } catch (error) {
        progressMessage.textContent =
          "There was a connection problem while loading progress.";
      }
    }
  </script>
</body>
</html>
